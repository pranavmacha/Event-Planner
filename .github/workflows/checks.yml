name: Gatherly checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install security tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit locked Python dependencies
        run: pip-audit --no-deps --disable-pip -r backend/requirements.lock.txt
      - name: Check Python security patterns
        run: bandit -r backend/app
      - name: Audit locked frontend dependencies
        run: npm audit --package-lock-only --audit-level=low
        working-directory: frontend
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.lock.txt
      - run: pytest -q
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          GEMINI_API_KEY: ''
          GATHERLY_BACKEND_COMMAND: python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
